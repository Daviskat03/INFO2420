<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site Design - Color Palette</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    margin: 40px;
}

h1 {
    text-align: center;
}

.palette {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.color-box {
    width: 180px;
    height: 120px;
    border-radius: 8px;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>Extreme Honeymoons Color Palette</h1>

<div class="palette">
    <div class="color-box" style="background:#F4F8F6;">#F4F8F6<br>Background</div>
    <div class="color-box" style="background:#1F2933; color:white;">#1F2933<br>Body Text</div>
    <div class="color-box" style="background:#1D3557; color:white;">#1D3557<br>H1 Headings</div>
    <div class="color-box" style="background:#2A6F97; color:white;">#2A6F97<br>H2 Headings</div>
    <div class="color-box" style="background:#2D6A4F; color:white;">#2D6A4F<br>H3 Headings</div>
    <div class="color-box" style="background:#1D4ED8; color:white;">#1D4ED8<br>Links</div>
    <div class="color-box" style="background:#6A4C93; color:white;">#6A4C93<br>Visited Links</div>
    <div class="color-box" style="background:#0B2D4A; color:white;">#0B2D4A<br>Hover Links</div>
</div>

</body>
</html>
